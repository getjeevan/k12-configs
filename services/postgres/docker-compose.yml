services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: aiserver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - ~/data/postgres:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh
    networks:
      - aiserver
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "aiserver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048m
        reservations:
          cpus: '1.0'
          memory: 1024m
networks:
  aiserver:
    driver: bridge
