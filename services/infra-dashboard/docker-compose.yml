services:
  infra-dashboard:
    build: .
    image: infra-dashboard:latest
    container_name: infra-dashboard
    restart: unless-stopped
    ports:
      - "7000:7000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/getjeevan/.ssh/id_ed25519_hostinger_rag:/root/.ssh/hostinger_key:ro
      - /home/getjeevan/services/infra-dashboard/static:/app/static
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
