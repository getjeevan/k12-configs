services:
  redis:
    container_name: redis
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ~/data/redis:/data
    networks:
      - aiserver
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024m
        reservations:
          cpus: '0.5'
          memory: 512m
networks:
  aiserver:
    driver: bridge
